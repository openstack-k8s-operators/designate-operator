---
- job:
    name: designate-operator-tempest-multinode
    parent: podified-multinode-edpm-deployment-crc
    dependencies: ["openstack-k8s-operators-content-provider"]
    irrelevant-files:
      - .*/*.md
      - ^.github/.*$
      - .ci-operator.yaml
      - .dockerignore
      - .gitignore
      - .golangci.yaml
      - .pre-commit-config.yaml
      - .prow_ci.env
      - ^LICENSE.*$
      - ^OWNERS$
      - ^OWNERS_ALIASES$
      - ^PROJECT$
      - .*go.(mod|sum|work).*
      - ^kuttl-test.yaml$
      - ^renovate.json$
      - ^config/samples/.*$
      - ^docs?/.*
      - ^hack/.*$
      - ^tests?/functional/.*$
      - ^tests?/kuttl/.*$
      - ^zuul.d/jobs.yaml
    vars:
      cifmw_cls_pv_count: 14
      cifmw_test_operator_tempest_container: openstack-tempest-all
      cifmw_run_test_role: test_operator
      cifmw_test_operator_tempest_network_attachments:
        - ctlplane
      cifmw_test_operator_tempest_include_list: |
        designate_tempest_plugin
      cifmw_test_operator_tempest_tempestconf_config:
        overrides: |
          dns.nameservers '172.50.0.81:53,172.50.0.80:53'
          designate.nameservers '172.50.0.81:53,172.50.0.80:53'
          dns_feature_enabled.api_v2_quotas True
          dns_feature_enabled.api_v2_root_recordsets True
          dns_feature_enabled.api_admin True
          dns_feature_enabled.api_v2 True
          dns_feature_enabled.api_v2_quotas_verify_project True
          dns_feature_enabled.enforce_scope False
          dns_feature_enabled.enforce_new_defaults False
          enforce_scope.designate False
      cifmw_edpm_prepare_kustomizations:
        - apiVersion: kustomize.config.k8s.io/v1beta1
          kind: Kustomization
          namespace: openstack
          patches:
            - target:
                kind: OpenStackControlPlane
              patch: |-
                apiVersion: core.openstack.org/v1beta1
                kind: OpenStackControlPlane
                metadata:
                  name: unused
                spec:
                  redis:
                    enabled: true
                    templates:
                      designate-redis:
                        replicas: 1
                  designate:
                    enabled: true
                    template:
                      designateAPI:
                        replicas: 1
                      designateBackendbind9:
                        networkAttachments:
                          - designate
                        replicas: 3
                        override:
                          services:
                            - metadata:
                                annotations:
                                  metallb.universe.tf/address-pool: designateext
                                  metallb.universe.tf/allow-shared-ip: designateext
                                  metallb.universe.tf/loadBalancerIPs: 172.50.0.80
                              spec:
                                type: LoadBalancer
                            - metadata:
                                annotations:
                                  metallb.universe.tf/address-pool: designateext
                                  metallb.universe.tf/allow-shared-ip: designateext
                                  metallb.universe.tf/loadBalancerIPs: 172.50.0.81
                              spec:
                                type: LoadBalancer
                            - metadata:
                                annotations:
                                  metallb.universe.tf/address-pool: designateext
                                  metallb.universe.tf/allow-shared-ip: designateext
                                  metallb.universe.tf/loadBalancerIPs: 172.50.0.82
                              spec:
                                type: LoadBalancer
                        storageClass: local-storage
                        storageRequest: 10G
                      designateCentral:
                        replicas: 1
                      designateMdns:
                        networkAttachments:
                          - designate
                        replicas: 3
                      designateNetworkAttachment: designate
                      designateProducer:
                        replicas: 1
                      designateUnbound:
                        defaultConfigOverwrite:
                          01-unbound.conf: |
                            server:
                              verbosity: 2
                              access-control: 100.64.0.0/10 allow
                              access-control: 172.28.0.0/24 allow
                              module-config: "iterator"
                        override:
                          services:
                            - metadata:
                                annotations:
                                  metallb.universe.tf/address-pool: designateext
                                  metallb.universe.tf/allow-shared-ip: designateext
                                  metallb.universe.tf/loadBalancerIPs: 172.50.0.85
                              spec:
                                type: LoadBalancer
                        replicas: 1
                      designateWorker:
                        networkAttachments:
                          - designate
                        replicas: 3
                      nsRecords:
                        - hostname: ns1.example.org.
                          priority: 10
                        - hostname: ns2.example.org.
                          priority: 20
                      redisServiceName: designate-redis
