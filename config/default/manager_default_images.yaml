# This patch inject custom ENV settings to the manager container
# Used to set our default image locations
apiVersion: apps/v1
kind: Deployment
metadata:
  name: controller-manager
  namespace: system
spec:
  template:
    spec:
      containers:
      - name: manager
        env:
        - name: RELATED_IMAGE_DESIGNATE_API_IMAGE_URL_DEFAULT
          value: quay.io/openstack-s2i-containers/openstack-designate-api:master-latest
        # MDNS and Producer inherit this image, including its resolved bundle digest.
        - name: RELATED_IMAGE_DESIGNATE_CENTRAL_IMAGE_URL_DEFAULT
          value: quay.io/openstack-s2i-containers/openstack-designate-central:master-latest
        - name: RELATED_IMAGE_DESIGNATE_WORKER_IMAGE_URL_DEFAULT
          value: quay.io/openstack-s2i-containers/openstack-designate-worker:master-latest
        - name: RELATED_IMAGE_DESIGNATE_BACKENDBIND9_IMAGE_URL_DEFAULT
          value: quay.io/openstack-s2i-containers/openstack-designate-backend-bind9:master-latest
        - name: RELATED_IMAGE_DESIGNATE_UNBOUND_IMAGE_URL_DEFAULT
          value: quay.io/openstack-s2i-containers/openstack-unbound:master-latest
        - name: RELATED_IMAGE_NET_UTILS_IMAGE_URL_DEFAULT
          value: quay.io/openstack-s2i-containers/openstack-netutils:master-latest
