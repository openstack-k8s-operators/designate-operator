# Once a deployment has reconciled in multipool mode a missing multipool
# ConfigMap must be reported on InputReady, the ConfigMap must not be
# re-created from the CR, and the deployed pools must not be torn down.
apiVersion: kuttl.dev/v1beta1
kind: TestAssert
timeout: 120
commands:
  - script: |
      set -e
      input_ready=$(oc get -n $NAMESPACE designate designate -o jsonpath='{range .status.conditions[?(@.type=="InputReady")]}{.status}{"|"}{.reason}{"|"}{.message}{end}')
      echo "InputReady condition: $input_ready"
      case "$input_ready" in
          "False|Error|"*"multipool ConfigMap is missing"*) ;;
          *)
              echo "ERROR: expected InputReady=False/Error reporting the missing multipool ConfigMap"
              exit 1
              ;;
      esac

      if oc get configmap designate-multipool-config -n $NAMESPACE 2>/dev/null; then
          echo "ERROR: the multipool ConfigMap must not be re-created from the CR"
          exit 1
      fi

      if ! oc get statefulset designate-backendbind9 -n $NAMESPACE 2>/dev/null; then
          echo "ERROR: the default pool StatefulSet should still exist"
          exit 1
      fi

      echo "SUCCESS: missing multipool ConfigMap reported without changing the deployed pools"
