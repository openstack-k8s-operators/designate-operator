apiVersion: kuttl.dev/v1beta1
kind: TestStep
commands:
  - script: |
      # Clear any stale state left behind by a previous (e.g. failed) run of this test.
      rm -f "/tmp/kuttl-aztsig-${NAMESPACE}-default-id" "/tmp/kuttl-aztsig-${NAMESPACE}-pool1-id" "/tmp/kuttl-aztsig-${NAMESPACE}-pool2-id"
      cat <<EOF | oc apply -n $NAMESPACE -f -
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: designate-multipool-config
      data:
        pools: |
          - name: default
            description: "Default BIND Pool"
            attributes:
              availability_zone: "az1"
            view: default-view
            bindReplicas: 1
            nsRecords:
              - hostname: ns1.example.org.
                priority: 1
          - name: pool1
            description: "Pool for Zone 1"
            attributes:
              availability_zone: "az2"
              region: "us-west"
            view: pool1-view
            bindReplicas: 1
            nsRecords:
              - hostname: ns2.example.org.
                priority: 1
      EOF
