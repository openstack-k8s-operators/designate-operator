apiVersion: kuttl.dev/v1beta1
kind: TestStep
commands:
  - script: |
      oc delete designate designate -n $NAMESPACE
      oc delete configmap designate-multipool-config -n $NAMESPACE
      # Clean up any remaining PVCs from the StatefulSets
      oc delete pvc -l service=designate-backendbind9 -n $NAMESPACE
      # the predictable IP maps only grow, they do not shrink
      # Assertions are retried until all resources converge, so retain the key
      # snapshots throughout step 3 and remove them only during cleanup.
      rm -f "/tmp/kuttl-aztsig-${NAMESPACE}-default-id" "/tmp/kuttl-aztsig-${NAMESPACE}-pool1-id" "/tmp/kuttl-aztsig-${NAMESPACE}-pool2-id"
