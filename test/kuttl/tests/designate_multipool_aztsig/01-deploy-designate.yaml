apiVersion: kuttl.dev/v1beta1
kind: TestStep
commands:
  - script: |
      cp ../../../../config/samples/designate_v1beta1_designate.yaml deploy
      cp ../../common/redis.yaml deploy
      cp ../../../../demo/examples/ns_records/ns_records_CR_example.yaml deploy
      # Do not modify the designate network attachment if it already
      # exists.
      if ! (oc get -n $NAMESPACE net-attach-def | grep designate);
      then
         cp ../../common/designate_nad.yaml deploy
      else
         echo "" > deploy/designate_nad.yaml
      fi
      oc kustomize deploy | oc apply -n $NAMESPACE -f -
      # Enable AZ-aware multipool mode: every pool (including default) gets
      # its own TSIG key/Secret, gated on each pool having a "view" set in
      # the multipool ConfigMap (already provided in 00-deploy-multipool-config.yaml).
      oc patch designate designate -n $NAMESPACE --type=merge -p '{"spec":{"azAwareMode":"Enabled"}}'
